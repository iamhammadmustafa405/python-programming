<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hammad Mustafa | Simple Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-content">
      <img class="profile-pic" src="ChatGPT Image Dec 27, 2025, 10_15_51 AM.png" alt="Portrait of Hammad Mustafa" />

      <div class="hero-text">
        <p class="eyebrow">Personal Website</p>
        <h1>Hammad Mustafa</h1>
        <p class="subtitle">Python learner exploring web and software development.</p>
        <button id="ctaBtn" type="button">Say Hi</button>
        <p id="message" class="message" aria-live="polite"></p>
      </div>
    </div>
  </header>

  <main class="features">
    <article class="card">
      <h2>Responsive</h2>
      <p>Looks good on both desktop and mobile screens.</p>
    </article>
    <article class="card">
      <h2>Lightweight</h2>
      <p>Plain HTML, CSS, and JavaScript with no framework overhead.</p>
    </article>
    <article class="card">
      <h2>Customizable</h2>
      <p>Easy to edit text, colors, and layout for your own project.</p>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
